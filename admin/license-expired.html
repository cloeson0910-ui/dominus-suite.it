<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Licenza non attiva</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--page-bg-color,#f4ecdf);font-family:var(--font-family,"Avenir Next","Helvetica Neue",Arial,sans-serif);color:var(--text-color,#7f6430);min-height:100vh;display:flex;align-items:center;justify-content:center}
.box{background:rgba(255,255,255,.4);padding:40px;max-width:440px;width:90%;text-align:center}
.logo{font-size:20px;font-weight:300;letter-spacing:.3em;color:#9c2f2f;margin-bottom:16px}
.msg{font-size:14px;line-height:1.7;color:#7f6430;margin-bottom:8px}
.reason{font-size:12px;color:#9c2f2f;margin-bottom:24px}
.btn{display:inline-block;padding:12px 26px;border:1px solid #a67f34;background:#a67f34;color:#fff;cursor:pointer;font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;font-family:inherit}
.btn:disabled{opacity:.55;cursor:default}
.portal-status{margin-top:14px;font-size:12px;color:#9a8a63;min-height:16px}
</style>
</head>
<body>
<div class="box">
  <div class="logo">ACCESSO SOSPESO</div>
  <p class="msg">Questo sito non risulta con un abbonamento attivo. Puoi riattivarlo direttamente da qui, oppure contattare il fornitore del servizio.</p>
  <p class="reason" id="reason"></p>
  <button class="btn" id="portalBtn" onclick="openPortal()">Gestisci abbonamento</button>
  <p class="portal-status" id="portalStatus"></p>
</div>

<script>
const CONTROL_PLANE_URL = "https://TUO-PROGETTO-CONTROL-PLANE.supabase.co"; // stesso valore di cp_config.js
const CONTROL_PLANE_ANON_KEY = "INCOLLA-QUI-LA-ANON-KEY-DEL-CONTROL-PLANE";

const params = new URLSearchParams(window.location.search);
document.getElementById("reason").textContent = params.get("motivo") || "";
const licenseCode = params.get("licenza") || "";

if(!licenseCode){
  document.getElementById("portalBtn").style.display = "none";
}

async function openPortal(){
  const btn = document.getElementById("portalBtn");
  const status = document.getElementById("portalStatus");
  btn.disabled = true;
  status.textContent = "Apertura pagina di pagamento…";

  try{
    const res = await fetch(CONTROL_PLANE_URL + "/functions/v1/create-portal-session", {
      method: "POST",
      headers: { "Content-Type": "application/json", "apikey": CONTROL_PLANE_ANON_KEY },
      body: JSON.stringify({ license_code: licenseCode }),
    });
    const data = await res.json();
    if(data.url){
      window.location.href = data.url;
    } else {
      status.textContent = data.error || "Nessun abbonamento trovato. Contatta il fornitore del servizio.";
      btn.disabled = false;
    }
  } catch(e){
    status.textContent = "Errore di connessione. Riprova o contatta il fornitore del servizio.";
    btn.disabled = false;
  }
}
</script>
</body>
</html>
