<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Accesso | Dominus</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,440;1,9..144,500&family=Archivo:wght@400;500;600;700&display=swap');
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:#F2ECDE; color:#3A362E; font-family:'Archivo', ui-sans-serif, system-ui, sans-serif;
  }
  .box{ background:#FBF8F0; border:1px solid rgba(60,50,30,0.16); padding:44px 40px; max-width:360px; width:90%; }
  .mark{ display:flex; align-items:center; gap:10px; justify-content:center; margin-bottom:26px; }
  .mark svg{ width:34px; height:34px; }
  .mark span{ font-family:'Archivo', sans-serif; font-weight:700; letter-spacing:.28em; font-size:14px; color:#14110D; }
  h1{ font-family:'Fraunces', Georgia, serif; font-weight:440; font-size:19px; text-align:center; color:#14110D; margin:0 0 26px; }
  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:#857D69; margin-bottom:6px; }
  .field input{
    width:100%; padding:12px 14px; border:1px solid rgba(60,50,30,0.16); background:#fff;
    font-family:inherit; font-size:14px; color:#14110D; outline:none;
  }
  .field input:focus{ border-color:#9C7A3E; }
  .btn{
    width:100%; padding:13px; border:1px solid #14110D; background:#14110D; color:#F2ECDE;
    cursor:pointer; font-size:12.5px; letter-spacing:.1em; text-transform:uppercase; font-family:inherit; margin-top:6px;
  }
  .btn:hover{ background:#7C5F2E; border-color:#7C5F2E; }
  .status{ margin-top:14px; font-size:12.5px; min-height:16px; text-align:center; }
  .error{ color:#9c2f2f; }
</style>
</head>
<body>
<div class="box">
  <div class="mark">
    <svg viewBox="0 0 60 60" aria-hidden="true"><circle cx="30" cy="30" r="28" fill="none" stroke="#9C7A3E" stroke-width="1.2"/><text x="30" y="39" text-anchor="middle" font-family="Fraunces, serif" font-style="italic" font-size="26" fill="#9C7A3E">D</text></svg>
    <span>DOMINVS</span>
  </div>
  <h1>Accesso pannello</h1>
  <div class="field"><label>Email</label><input id="email" type="email" autocomplete="username"></div>
  <div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password"></div>
  <button class="btn" onclick="doLogin()">Accedi</button>
  <div id="status" class="status"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
  const CP_SUPABASE_URL = "https://TUO-PROGETTO-CONTROL-PLANE.supabase.co";
  const CP_SUPABASE_ANON_KEY = "INCOLLA-QUI-LA-ANON-KEY-DEL-CONTROL-PLANE";
  const client = window.supabase.createClient(CP_SUPABASE_URL, CP_SUPABASE_ANON_KEY);

  window.doLogin = async function(){
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const statusEl = document.getElementById("status");
    statusEl.textContent = "Accesso in corso…";
    statusEl.className = "status";

    const { error } = await client.auth.signInWithPassword({ email, password });
    if(error){
      statusEl.textContent = "Errore: " + error.message;
      statusEl.className = "status error";
      return;
    }
    window.location.href = "leads.html";
  };
</script>
</body>
</html>
